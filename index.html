<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>赵明，我喜欢你</title>
<style>
body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e0 0%, #ffe0ec 40%, #ffc2d4 100%);
    font-family: "Microsoft YaHei", sans-serif;
    overflow: hidden;
}
.container {
    text-align: center;
    background: rgba(255,255,255,0.9);
    padding: 50px;
    border-radius: 30px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.1);
}
h1 {
    color: #d63384;
    font-size: 28px;
    margin-bottom: 40px;
}
button {
    padding: 15px 50px;
    font-size: 20px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin: 10px;
    transition: transform 0.2s;
}
#yesBtn {
    background-color: #ff4d6d;
    color: white;
    box-shadow: 0 5px 15px rgba(255,77,109,0.4);
}
#noBtn {
    background-color: #fff;
    color: #666;
    border: 2px solid #ddd;
}
button:active {
    transform: scale(0.95);
}
#result {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
    flex-direction: column;
}
#result img {
    max-width: 80%;
    max-height: 60%;
    border-radius: 20px;
    border: 5px solid white;
}
#text {
    color: white;
    font-size: 32px;
    margin-top: 20px;
    text-shadow: 2px 2px 4px black;
}
</style>
</head>
<body>

<div class="container">
    <h1>赵明，我喜欢你 💍<br>你愿意嫁给我吗？</h1>
    <button id="yesBtn" onclick="showPic('kiss.jpg', '😘 良子亲亲你～ 一辈子不许反悔！')">同意 💖</button>
    <button id="noBtn" onclick="showPic('angry.jpg', '😠 为什么拒绝我？！良子生气了！！')">不同意 💔</button>
</div>

<div id="result">
    < img id="img" src="">
    <div id="text"></div>
</div>

<script>
function showPic(imgName, text) {
    // 隐藏按钮
    document.querySelector('.container').style.display = 'none';
    // 显示图片和文字
    document.getElementById('img').src = imgName;
    document.getElementById('text').innerText = text;
    document.getElementById('result').style.display = 'flex';
}
</script>
</body>
</html>
