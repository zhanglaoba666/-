<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赵明，我有话对你说💕</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ffd6e0 0%, #ffe0ec 40%, #ffc2d4 100%);
    font-family: "PingFang SC","Microsoft YaHei",sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* ❤️ 飘落爱心 */
  .hearts {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 0;
    overflow: hidden;
  }
  .hearts span {
    position: absolute;
    top: -40px;
    font-size: 22px;
    opacity: .7;
    animation: fall linear infinite;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* 主卡片 */
  .card {
    position: relative; z-index: 1;
    background: rgba(255,255,255,.88);
    backdrop-filter: blur(12px);
    border-radius: 28px;
    padding: 48px 36px 40px;
    max-width: 420px; width: 90%;
    box-shadow: 0 20px 60px rgba(214,51,108,.25);
    text-align: center;
    transition: opacity .4s, transform .4s;
  }
  .card.hide { opacity: 0; transform: scale(.92); pointer-events: none; }

  h1 {
    font-size: 26px; line-height: 1.6;
    color: #d63384;
    margin-bottom: 12px;
    text-shadow: 0 2px 6px rgba(214,51,108,.12);
  }
  h1 .ring { font-size: 30px; }

  .sub { color: #b05a78; font-size: 15px; margin-bottom: 36px; }

  .btns { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .btns button {
    padding: 14px 38px;
    border: none; border-radius: 50px;
    font-size: 18px; font-weight: 700;
    cursor: pointer; transition: all .25s;
    letter-spacing: 1px;
  }
  .yes {
    background: linear-gradient(135deg,#ff4d6d,#ff7090);
    color: #fff;
    box-shadow: 0 6px 20px rgba(255,77,109,.45);
  }
  .yes:active { transform: scale(.95); }
  .no {
    background: #fff;
    color: #c9184a;
    border: 2px solid #ffb3c1;
  }
  .no:active { transform: scale(.95); }

  /* 结果页 */
  .result {
    position: fixed; inset: 0; z-index: 10;
    display: none;
    justify-content: center; align-items: center;
    flex-direction: column;
    background: rgba(0,0,0,.55);
    backdrop-filter: blur(6px);
  }
  .result.show { display: flex; }

  .result img {
    max-width: 88vw; max-height: 65vh;
    border-radius: 20px;
    box-shadow: 0 12px 50px rgba(0,0,0,.45);
    animation: pop .5s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  .result .caption {
    margin-top: 20px;
    font-size: 26px; font-weight: 800;
    color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.6);
    animation: pop .6s ease;
  }

  /* 音乐按钮 */
  .music-btn {
    position: fixed; top: 16px; right: 16px; z-index: 99;
    width: 42px; height: 42px;
    border-radius: 50%; border: none;
    background: rgba(255,255,255,.85);
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
    font-size: 20px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
</style>
</head>
<body>

<!-- ❤️ 飘落爱心 -->
<div class="hearts" id="hearts"></div>

<!-- 🎵 音乐 -->
<audio id="bgm" loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
</audio>
<button class="music-btn" id="musBtn" title="播放/暂停">🔇</button>

<!-- 主卡片 -->
<div class="card" id="card">
  <h1>赵明<br>我喜欢你<span class="ring">💍</span><br>你愿意嫁给我吗？</h1>
  <p class="sub">— 来自良子</p >
  <div class="btns">
    <button class="yes" onclick="choose('yes')">💖 同意</button>
    <button class="no"  onclick="choose('no')">💔 不同意</button>
  </div>
</div>

<!-- 结果层 -->
<div class="result" id="res">
  < img id="resImg" src="" alt="">
  <div class="caption" id="resCap"></div>
</div>

<script>
  /* ❤️ 飘心 */
  const container = document.getElementById('hearts');
  for(let i=0;i<30;i++){
    const s=document.createElement('span');
    s.textContent='❤️';
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(4+Math.random()*4)+'s';
    s.style.animationDelay=Math.random()*6+'s';
    s.style.fontSize=(16+Math.random()*18)+'px';
    s.style.opacity=.3+Math.random()*.5;
    container.appendChild(s);
  }

  /* 🎵 音乐 */
  const bgm=document.getElementById('bgm'), musBtn=document.getElementById('musBtn');
  let played=false;
  function tryPlay(){
    if(played) return;
    bgm.play().then(()=>{ played=true; musBtn.textContent='🎵'; }).catch(()=>{});
  }
  document.addEventListener('click', tryPlay, {once:false});
  musBtn.onclick=()=>{ bgm.paused?(bgm.play(),musBtn.textContent='🎵'):(bgm.pause(),musBtn.textContent='🔇'); };

  /* 选择 */
  function choose(type){
    document.getElementById('card').classList.add('hide');
    const r=document.getElementById('res');
    const img=document.getElementById('resImg');
    const cap=document.getElementById('resCap');
    if(type==='yes'){
      img.src='kiss.jpg';          //
